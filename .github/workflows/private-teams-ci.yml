name: Private Teams macOS validation

on:
  push:
    branches: [fix/teams-caption-names]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: private-teams-validation
  cancel-in-progress: false

jobs:
  macos:
    if: github.ref == 'refs/heads/fix/teams-caption-names'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.1.1
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: private-teams-macos
      - run: xcodebuild -downloadComponent MetalToolchain
      - name: Test naming and native caption parsing
        run: cargo test --locked -p transcript -p detect
      - name: Generate bindings through their owning generators
        run: |
          cargo test --locked -p tauri-plugin-detect export_types
          cargo test --locked -p tauri-plugin-transcription export_types
          cargo test --locked -p tauri-plugin-detect command_manifest_is_single_source
      - name: Publish generated contracts on the implementation branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add plugins/detect/js/bindings.gen.ts plugins/detect/permissions/autogenerated plugins/detect/permissions/schemas plugins/transcription/js/bindings.gen.ts
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Generate native Teams caption contracts'
            git -c credential.helper='!gh auth git-credential' push origin HEAD:fix/teams-caption-names
          fi
      - run: pnpm -F @anlg/ui build
      - run: pnpm -F @anlg/desktop typecheck
      - name: Verify affected frontend flows
        run: pnpm -F @anlg/desktop exec vitest run src/stt/teams-captions.test.ts src/stt/speaker-context.test.ts src/stt/speaker-context-capture.test.ts src/stt/useResolvedSpeakerSegments.test.tsx src/settings/general/index.test.tsx
      - name: Check desktop native integration
        run: cargo check --locked -p desktop --features direct-distribution
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: generated-contracts
          path: |
            plugins/detect/js/bindings.gen.ts
            plugins/transcription/js/bindings.gen.ts
          retention-days: 7
